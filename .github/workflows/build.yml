# Builds and tests the package and the key-capture kit on every push and pull request.
#
# Signing:
# - Branches and pull requests: the APK is signed with a throwaway key made fresh on each run
#   (build-app.sh creates one when private/keys is empty). Those zips can't update an install
#   signed with the release key; they are for checking the build only.
# - Tags v<version> (for example v1.0.0): the APK is signed with the release key from the
#   repository secrets HKGPM_KEYSTORE_B64 (the JKS keystore, base64; alias hkgpm) and
#   HKGPM_KEYSTORE_PASSWORD, the tag must match the version in app/AndroidManifest.xml,
#   package/NEMESIS.data and the built APK, and the zips are attached to the GitHub release for
#   the tag.
#
# The on-car test catalogs (tests/catalog/make_catalog.py car) are signed with keys that are public
# on purpose, so they go to dist/test/ and their own artifact, never to a release.
#
# tools/build-test-packages.sh needs ../hmg_nemesis, so the checklist's test packages aren't
# built here.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build-package.sh writes git describe into BUILD

      - name: Tag matches the version
        if: env.RELEASE == 'true'
        run: |
          v=${GITHUB_REF_NAME#v}
          grep -q "android:versionName=\"$v\"" app/AndroidManifest.xml || { echo "::error::app/AndroidManifest.xml versionName is not $v"; exit 1; }
          grep -qx "version=$v" package/NEMESIS.data || { echo "::error::package/NEMESIS.data version is not $v"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mksh zip unzip

      - name: Android SDK (platform 19, build-tools 30.0.3)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-19" "build-tools;30.0.3" > /dev/null
          echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Toolchain (Maven jars)
        run: |
          tools/toolchain.sh fetch
          tools/toolchain.sh check

      - name: Host tests
        run: |
          tools/test-java.sh
          sh tests/kit/run.sh
          sh tests/resume/run.sh
          python3 -m unittest discover -s tests/catalog -v
          python3 -m unittest discover -s tests/cli -v
          tools/lint-sh.sh kit package stick

      - name: Release signing key
        if: env.RELEASE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.HKGPM_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HKGPM_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::release tags need the secrets HKGPM_KEYSTORE_B64 and HKGPM_KEYSTORE_PASSWORD"
            exit 1
          fi
          umask 077
          mkdir -p private/keys
          echo "$KEYSTORE_B64" | base64 -d > private/keys/hkgpm.jks
          printf '%s\n' "$KEYSTORE_PASSWORD" > private/keys/password

      - name: Build and check the app, package and kit
        run: |
          sh tests/app/check-app.sh
          "$ANDROID_SDK/build-tools/30.0.3/apksigner" verify --print-certs build/app/hkgpm.apk | grep -E 'SHA-256|DN:'
          if [ "$RELEASE" = true ]; then
            v=${GITHUB_REF_NAME#v}
            "$ANDROID_SDK/build-tools/30.0.3/aapt" dump badging build/app/hkgpm.apk | grep -q "versionName='$v'" \
              || { echo "::error::the built APK's versionName is not $v (see VERSION_NAME in tools/build-app.sh)"; exit 1; }
          fi
          tools/build-package.sh
          sh tests/package/run.sh
          tools/build-kit.sh
          python3 tests/catalog/make_catalog.py car dist/test-catalogs
          mkdir -p dist/test
          (cd dist/test-catalogs && zip -qr ../test/hkg-test-catalogs.zip .)

      - name: Remove the signing key
        if: always()
        run: rm -rf private/keys

      - uses: actions/upload-artifact@v4
        with:
          name: hkg-package-manager-${{ env.RELEASE == 'true' && github.ref_name || format('ci-{0}', github.sha) }}
          path: dist/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: hkg-test-catalogs-${{ env.RELEASE == 'true' && github.ref_name || format('ci-{0}', github.sha) }}
          path: dist/test/hkg-test-catalogs.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hkg-package-manager-${{ github.ref_name }}
          path: dist

      - name: Attach the zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "HKG Package Manager $GITHUB_REF_NAME. Copy the contents of hkg-package-manager.zip (NEMESIS.data and packages/) to the root of a USB stick and plug it into the car; NEMESIS installs it. hkg-keycap-kit.zip is the read-only key-capture kit."
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
